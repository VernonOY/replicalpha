[project]
name = "replicalpha"
version = "0.1.0"
description = "Research-reproduction Agent: PDF → executable factor code → backtest → Red Team → reproducibility score."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VernonOY" }]
requires-python = ">=3.11"
keywords = ["quant", "research", "llm", "agent", "factor", "backtest", "alpha"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "pandas>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.40",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
replicalpha = "replicalpha.cli.main:cli"

[project.urls]
Homepage = "https://github.com/VernonOY/replicalpha"
Issues = "https://github.com/VernonOY/replicalpha/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicalpha"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/replicalpha/vendored"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/replicalpha/vendored/"]

[[tool.mypy.overrides]]
module = ["fitz", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --cov=src/replicalpha --cov-report=term-missing --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/replicalpha"]
omit = ["src/replicalpha/vendored/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
